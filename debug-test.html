<!DOCTYPE html>
<html>
<head><title>Debug Test</title></head>
<body>
<h1>Debug Test for demo.jeldi.app</h1>
<button onclick="testFetch()">Test Fetch</button>
<div id="result"></div>
<script>
async function testFetch() {
  const result = document.getElementById('result');
  result.innerHTML = 'Testing...';
  
  try {
    console.log('Testing fetch to:', 'https://demo.jeldi.app/api/oauth/providers');
    const response = await fetch('https://demo.jeldi.app/api/oauth/providers');
    console.log('Response status:', response.status);
    console.log('Response headers:', [...response.headers.entries()]);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    result.innerHTML = `<h3>Success!</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
  } catch (error) {
    console.error('Fetch error:', error);
    result.innerHTML = `<h3 style="color: red;">Error: ${error.message}</h3>
                       <p>Check browser console for details</p>`;
  }
}
</script>
</body>
</html>
