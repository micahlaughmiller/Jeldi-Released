name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::537692431436:role/GithubDeploy-OWNER-REPO
          role-session-name: github-actions-deploy-session
          aws-region: us-east-2

      - name: Install Serverless Framework
        run: npm install -g serverless@4

      - name: Deploy to AWS Lambda
        run: serverless deploy --config serverless.yml --stage production --verbose
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 overlay.jeldi.app and demo.jeldi.app are now updated"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs for details."
          exit 1
