name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Set the AWS_DEPLOY_ROLE_ARN repository secret; the fallback is the role name the setup doc creates
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::537692431436:role/GithubDeploy-micahlaughmiller-Jeldi-Released' }}
          role-session-name: github-actions-deploy-session
          aws-region: us-east-2

      - name: Install Serverless Framework
        run: npm install -g serverless@4

      - name: Deploy to AWS Lambda
        run: serverless deploy --config serverless.yml --stage production --verbose
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          AWS_DOMAIN: ${{ vars.AWS_DOMAIN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          EMAIL_OAUTH_REDIRECT_URI: ${{ vars.EMAIL_OAUTH_REDIRECT_URI }}

      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 overlay.jeldi.app and demo.jeldi.app are now updated"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs for details."
          exit 1
