    service: jeldi-backend
    frameworkVersion: '4'

    provider:
      name: aws
      runtime: nodejs20.x   # update to 20.x (recommended); change to 18.x if you must
      region: us-east-2
      stage: production
      environment:
        NODE_ENV: production
        JWT_SECRET: ${env:JWT_SECRET}
        DATABASE_URL: ${env:DATABASE_URL}
        TOKEN_ENCRYPTION_KEY: ${env:TOKEN_ENCRYPTION_KEY}
        OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
        GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
        GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET, ''}
        MICROSOFT_CLIENT_ID: ${env:MICROSOFT_CLIENT_ID, ''}
        MICROSOFT_CLIENT_SECRET: ${env:MICROSOFT_CLIENT_SECRET, ''}
        DEMO_MODE: ${env:DEMO_MODE, 'false'}
        DEMO_USER_PASSWORD: ${env:DEMO_USER_PASSWORD, ''}
        AWS_DOMAIN: ${env:AWS_DOMAIN, ''}
        FRONTEND_URL: ${env:FRONTEND_URL, ''}
        EMAIL_OAUTH_REDIRECT_URI: ${env:EMAIL_OAUTH_REDIRECT_URI, ''}
      iamRoleStatements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - "*"

    build:
      esbuild:
        bundle: false  # you're using dist/, so keep false. Set to true if you want Serverless to bundle.

    functions:
      api:
        handler: dist/lambda.handler
        timeout: 25
        events:
          - http:
              path: /
              method: ANY
              cors: true
          - http:
              path: /{proxy+}
              method: ANY
              cors: true

      # Scheduled ERP sync (Epicor / SyteLine connectors). Adjust the rate to the customers' tolerance for data age.
      sync:
        handler: dist/sync-lambda.handler
        timeout: 300
        events:
          - schedule: rate(15 minutes)

    plugins:
      - serverless-offline

    custom:
      serverless-offline:
        httpPort: 3001
