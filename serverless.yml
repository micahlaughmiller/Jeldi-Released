service: jeldi-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-2
  stage: production
  environment:
    NODE_ENV: production
    JWT_SECRET: ${env:JWT_SECRET}
    DATABASE_URL: ${env:DATABASE_URL}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource: 
        - "*"

functions:
  api:
    handler: dist/lambda.handler
    timeout: 25
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001